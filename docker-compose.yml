# Two services, not one process pair in a single container.
#
# They have genuinely different failure modes and different jobs, and collapsing them meant a
# crash in either took down both: the old entrypoint deliberately exited the whole container
# if either process died, so a transient failure mid-investigation also blacked out the
# dashboard that would have told you about it. An observability tool going dark because the
# thing it observes had a problem is the worst possible coupling.
#
# Split:
#   api      — read-mostly, serves the dashboard and the review actions. Must stay up.
#   sentinel — the long-running agency loop. Restarting it is cheap and expected.
#
# They share ./store as the single source of truth. Concurrent writes are safe: store/state.js
# takes a cross-process lock around every read-modify-write, so an approval landing during a
# sweep can't be clobbered by it.

services:
  api:
    build: .
    command: ["node", "src/web/server.js"]
    ports:
      - "8420:8420"
    env_file:
      - .env
    volumes:
      - ./store:/app/store
      # Practice docs are read fresh on every reasoning step, so mounting them means editing
      # a guardrail takes effect on the next sweep without a rebuild.
      - ./sre-as-code:/app/sre-as-code:ro
    restart: unless-stopped
    healthcheck:
      # Process-only liveness. Product readiness (Mimir + Loki + Tempo + sentinel freshness)
      # is exposed separately at /api/health, so a degraded agent never takes the review UI
      # down with it.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8420/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  sentinel:
    build: .
    command: ["node", "bin/sre", "start"]
    env_file:
      - .env
    volumes:
      - ./store:/app/store
      - ./sre-as-code:/app/sre-as-code:ro
    restart: unless-stopped
    depends_on:
      # Ordering only — the sentinel writes state the API reads, and starting the API first
      # means the dashboard is already serving when the first sweep lands.
      - api
    healthcheck:
      # The daemon has no port. Readiness is based on its explicit lifecycle state and a fresh
      # successful sweep, not merely the fact that its process is still present.
      test: ["CMD", "node", "-e", "const s=require('/app/src/store/state').load(); const h=require('/app/src/lgtm/health').assessSentinel(s); process.exit(h.up?0:1)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
